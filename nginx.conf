server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Note: we deliberately do NOT set a strict Content-Security-Policy because
    # the page uses inline styles and Google Fonts. If you want to tighten CSP,
    # you must allow fonts.googleapis.com and fonts.gstatic.com.

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # --- Public HTML: no cache (so fee rules and copy update immediately) ---
    location ~ ^/(index|kalkulator|kalkulatory|sprzedaz-nieruchomosci-checklista|odrzucenie-spadku|najem-okazjonalny|umowa-przedwstepna|moje-sprawy|specjalisci|dla-specjalistow|dla-kancelarii|kancelarie|profil-specjalisty|moderacja|o-kancelio|kontakt|weryfikacja-specjalistow|standard-redakcyjny|privacy)\.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Stable, crawlable public profile URLs backed by the safe Supabase RPC.
    location ~ ^/specjalista/[a-z0-9-]+/?$ {
        add_header Cache-Control "no-cache";
        try_files /profil-specjalisty.html =404;
    }

    # Short, memorable aliases kept for navigation and manually entered URLs.
    location = /sprzedaz-krok-po-kroku {
        return 301 https://kancelio.pl/sprzedaz-nieruchomosci-checklista.html;
    }
    location = /sprzedaz-krok-po-kroku.html {
        return 301 https://kancelio.pl/sprzedaz-nieruchomosci-checklista.html;
    }

    # Runtime config can change between deploys and must never be cached.
    location = /assets/config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /profile-sitemap.xml {
        proxy_ssl_server_name on;
        proxy_set_header Host bllhplbexaknsbciztsv.supabase.co;
        proxy_pass https://bllhplbexaknsbciztsv.supabase.co/functions/v1/directory-sitemap;
    }

    location /assets/ {
        # Asset filenames are stable, so every use must revalidate instead of
        # mixing JavaScript from an older deployment with current HTML.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # --- Variants (also HTML) ---
    location /variants/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # --- Everything else ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
