server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Note: we deliberately do NOT set a strict Content-Security-Policy because
    # the page uses inline styles and Google Fonts. If you want to tighten CSP,
    # you must allow fonts.googleapis.com and fonts.gstatic.com.

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    # --- HTML: no cache (so edits show up immediately) ---
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- Variants (also HTML) ---
    location /variants/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # --- Everything else ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
